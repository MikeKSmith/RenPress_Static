name: "renaissance-press"
output_dir: "docs"
exclude: ["build.R", "theme.R", "README.md", "README.html", "README_files",
          "AGENTS.md", "AGENTS.html", "LICENSE", "head.html", "header.html", "footer.html",
          "*.Rproj"]
include: ["CNAME", ".nojekyll"]

# The site masthead and footer are hand-built partials (header.html / footer.html)
# that mirror the WordPress "Twenty Sixteen" markup (site-header / site-footer),
# injected via the includes below — so there is no auto-generated Bootstrap
# navbar.
#
# Every page's own content is plain Markdown: a handful of Pandoc fenced divs
# (`::: hero`, `::: catalogue`/`::: item`, `::: figure`, `::: contact-card`)
# mark out the few structural blocks that need a CSS hook; everything inside
# them — eyebrow labels, "by" lines, descriptions — is styled in styles.css by
# position (`.hero > p:first-child`, `.item h3 + p`, …), not by HTML class
# attributes on every paragraph. `md_extensions: -implicit_figures` is set so
# a bare `![cover](x.jpg)` stays a plain image; the two pages that want a
# captioned photo use an explicit `::: figure` div instead. See AGENTS.md.

# The `theme:` block below is a bslib::bs_theme() specification expressed in YAML.
# rmarkdown passes it straight to bslib, so the WordPress "Twenty Sixteen" fonts
# and colours are captured through Bootstrap 5. Twenty Sixteen's layout
# signature (the white sheet floating on a grey page, hairline rules, catalogue
# cards) lives in styles.css. See theme.R for the identical theme as R code.
output:
  html_document:
    theme:
      version: 5
      bg: "#ffffff"          # content sheet — .site { background:#fff }
      fg: "#1a1a1a"          # body text color
      primary: "#666666"     # custom CSS: a { color:#666 } (overrides theme blue)
      secondary: "#686868"   # muted grey
      base_font:
        google: "Merriweather"
      heading_font:
        google: "Montserrat"
      code_font:
        google: "Inconsolata"
      "font-size-base": "1rem"      # 16px
      "line-height-base": "1.75"
      "headings-font-weight": "700"
      "border-color": "#d1d1d1"
      "link-decoration": "none"
    css: styles.css
    md_extensions: -implicit_figures
    includes:
      in_header: head.html
      before_body: header.html
      after_body: footer.html
    toc: false
    self_contained: false
    section_divs: true
    fig_caption: true
    highlight: null
    mathjax: null
