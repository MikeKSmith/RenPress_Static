<header id="masthead" class="site-header" role="banner">

  <div class="header-image">
    <a data-rp-href="index.html" href="index.html" rel="home">
      <img class="custom-header-image"
           data-rp-src="assets/cropped-Untitled-design-1.png"
           src="assets/cropped-Untitled-design-1.png"
           alt="Renaissance Press">
    </a>
  </div><!-- .header-image -->

  <div class="site-header-main">

    <div class="site-branding">
      <p class="site-title"><a data-rp-href="index.html" href="index.html" rel="home">Renaissance Press</a></p>
      <p class="site-description">Edinburgh, Scotland</p>
    </div><!-- .site-branding -->

    <button id="menu-toggle" class="menu-toggle" aria-controls="site-navigation" aria-expanded="false">Menu</button>

    <nav id="site-navigation" class="main-navigation" role="navigation" aria-label="Primary Menu">
      <div class="menu-primary-container">
        <ul class="primary-menu">
          <li class="menu-item"><a data-rp-href="index.html"   href="index.html">Home</a></li>
          <li class="menu-item"><a data-rp-href="books.html"   href="books.html">Books</a></li>
          <li class="menu-item"><a data-rp-href="prints.html"  href="prints.html">Prints</a></li>
          <li class="menu-item"><a data-rp-href="folios.html"  href="folios.html">Folios</a></li>
          <li class="menu-item"><a data-rp-href="contact.html" href="contact.html">Contact us</a></li>
        </ul>
      </div>
    </nav><!-- .main-navigation -->

  </div><!-- .site-header-main -->
</header><!-- .site-header -->

<script>
/* Fix partial link paths for pages at any folder depth, and drive the mobile
   menu toggle. The stylesheet link tells us the relative path back to the site
   root (e.g. "../" inside products/ and people/). */
document.addEventListener('DOMContentLoaded', function () {
  var css = document.querySelector('link[href$="styles.css"]');
  var base = css ? css.getAttribute('href').replace(/styles\.css$/, '') : '';
  document.querySelectorAll('[data-rp-href]').forEach(function (a) {
    a.setAttribute('href', base + a.getAttribute('data-rp-href'));
  });
  document.querySelectorAll('[data-rp-src]').forEach(function (el) {
    el.setAttribute('src', base + el.getAttribute('data-rp-src'));
  });
  var toggle = document.getElementById('menu-toggle');
  var nav = document.getElementById('site-navigation');
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('toggled');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
});
</script>
